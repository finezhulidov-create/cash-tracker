spring.application.name=cash-tracker

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Коллекции и связи подгружаются пачками по 50, а не по одному запросу на строку (защита от N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.expiration=86400000

# CORS: адреса фронтенда через запятую
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Ограничение частоты запросов к /auth/**: не больше requests запросов с одного IP за window-seconds секунд
app.rate-limit.auth.enabled=true
app.rate-limit.auth.requests=30
app.rate-limit.auth.window-seconds=60

# Actuator: наружу только health и info; детали health (БД, Redis) скрыты
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Swagger UI
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

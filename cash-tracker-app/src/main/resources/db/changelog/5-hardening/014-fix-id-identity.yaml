databaseChangeLog:
  # В changeset'ах 006, 008 и 010 autoIncrement был указан внутри constraints и Liquibase его игнорировал:
  # id получился обычным BIGINT без значения по умолчанию, и INSERT без явного id падал с
  # "null value in column id violates not-null constraint". Старые changeset'ы менять нельзя
  # (изменится checksum), поэтому исправляем новым. Он идемпотентен: если identity (или sequence)
  # у колонки уже есть, таблица пропускается; существующие строки учитываются в стартовом значении.
  - changeSet:
      id: 15-fix-id-identity-transaction-split-budget
      author: zhulidovdev
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                t       text;
                next_id bigint;
              BEGIN
                FOREACH t IN ARRAY ARRAY['transaction', 'transaction_split', 'budget'] LOOP
                  IF EXISTS (
                    SELECT 1 FROM information_schema.columns
                    WHERE table_schema = current_schema()
                      AND table_name = t
                      AND column_name = 'id'
                      AND is_identity = 'NO'
                      AND column_default IS NULL
                  ) THEN
                    EXECUTE format('SELECT COALESCE(MAX(id), 0) + 1 FROM %I', t) INTO next_id;
                    EXECUTE format(
                      'ALTER TABLE %I ALTER COLUMN id ADD GENERATED BY DEFAULT AS IDENTITY (START WITH %s)',
                      t, next_id);
                  END IF;
                END LOOP;
              END
              $$;

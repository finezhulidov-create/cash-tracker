# spring.datasource.* сюда не прописываем: url/username/password подставляет
# Testcontainers через @DynamicPropertySource (см. CashTrackerApplicationTests),
# и динамические значения перекрывают любые статические из этого файла.

spring.liquibase.enabled=true

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JwtService декодирует секрет как base64 и требует минимум 32 байта (HS256),
# поэтому значение должно быть именно валидной base64-строкой. Только для тестов.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3RzLTAxMjM0NTY3ODk=

# Интеграционные тесты делают много логинов с одного IP, поэтому общий лимит делаем практически
# недостижимым; сам лимит проверяет RateLimitIntegrationTest со своими настройками.
app.rate-limit.auth.requests=100000
